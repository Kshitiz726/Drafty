<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --bg:#fff; --bg2:#f7f5f2; --fg:#1d1d1f; --muted:#6e6e73; --line:#e7e3dd; --field:#fbfaf8; --accent:#D97757; --soft: rgba(217,119,87,.10); }
    @media (prefers-color-scheme: dark) { :root { --bg:#1f2124; --bg2:#26292d; --fg:#ececee; --muted:#9a9ca3; --line:#34373c; --field:#191a1d; --soft: rgba(217,119,87,.16); } }
    * { box-sizing: border-box; }
    body { margin:0; width: 350px; background: var(--bg); color: var(--fg); font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display:flex; align-items:center; gap:10px; padding: 14px 16px 12px; }
    .brand { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color:#fff; display:grid; place-items:center; }
    header b { font-size: 15px; display:block; }
    header small { color: var(--muted); }
    section { padding: 12px 16px; border-top: 1px solid var(--line); }
    h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .muted { color: var(--muted); font-size: 12px; }
    a { color: var(--accent); }
    .providers { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .prov { position: relative; text-align:left; border: 1.5px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 10px 11px; cursor: pointer; color: var(--fg); font: inherit; }
    .prov b { display:block; font-size: 13px; }
    .prov span { font-size: 11px; color: var(--muted); }
    .prov.on { border-color: var(--accent); background: var(--soft); }
    .prov .dot { position:absolute; top: 11px; right: 11px; width:7px; height:7px; border-radius:50%; background:#bbb; }
    .prov .dot.ok { background:#34c759; }
    .signin { display:none; margin-top: 8px; }
    .actions { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions button { border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 10px; padding: 10px; font: 600 12.5px inherit; cursor: pointer; text-align:left; }
    .actions button:hover { border-color: var(--accent); }
    .actions button kbd { display:block; font: 11px inherit; color: var(--muted); margin-top: 3px; }
    label.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 6px 0; }
    textarea, input[type=text], select { width:100%; border:1px solid var(--line); border-radius:9px; padding:8px 9px; background:var(--field); color:var(--fg); font: inherit; resize: vertical; outline: none; }
    select { width: 140px; padding: 6px 8px; }
    textarea:focus, input[type=text]:focus, select:focus { border-color: var(--accent); }
    .field { margin: 8px 0 2px; }
    .field span { display:block; margin-bottom: 5px; font-weight: 600; font-size: 12px; }
    input[type=range] { width: 120px; accent-color: var(--accent); }
    output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 60px; text-align: right; }
    .switch { position: relative; width: 34px; height: 20px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch i { position:absolute; inset:0; background: var(--line); border-radius: 999px; transition: .2s; cursor: pointer; }
    .switch i::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .switch input:checked + i { background: var(--accent); }
    .switch input:checked + i::after { transform: translateX(14px); }
  </style>
</head>
<body>
  <header>
    <span class="brand"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l1.9 6.6L20.5 10.5l-6.6 1.9L12 19l-1.9-6.6L3.5 10.5l6.6-1.9z"/></svg></span>
    <div><b>Drafty</b><small>AI replies and page assistant</small></div>
  </header>

  <section>
    <h4>AI model</h4>
    <div class="providers" id="providers"></div>
    <div class="signin muted" id="signin"></div>
  </section>

  <section>
    <div class="actions">
      <button id="draftHere">Draft reply<kbd id="k1">Alt+R</kbd></button>
      <button id="assistHere">Page assistant<kbd id="k2">Alt+A</kbd></button>
    </div>
    <div class="muted" style="margin-top:8px">Works in chats, emails and comment boxes on any site. <a href="#" id="shortcuts">Change shortcuts</a></div>
  </section>

  <section>
    <h4>Behaviour</h4>
    <label class="row"><span>Insert replies automatically</span><span class="switch"><input type="checkbox" id="autoInsert" /><i></i></span></label>
    <label class="row"><span>Auto-draft new chat messages</span><span class="switch"><input type="checkbox" id="auto" /><i></i></span></label>
    <label class="row"><span>Show page assistant button</span><span class="switch"><input type="checkbox" id="launcher" /><i></i></span></label>
    <label class="row"><span>Keep chat history clean</span><span class="switch"><input type="checkbox" id="cleanup" /><i></i></span></label>
  </section>

  <section>
    <h4>Language</h4>
    <label class="row"><span>Reply in</span><select id="replyLang"></select></label>
    <label class="row"><span>Translate and summarize into</span><select id="translateTo"></select></label>
  </section>

  <section>
    <h4>Personalisation</h4>
    <div class="field"><span>Your name</span><input type="text" id="myName" placeholder="Used for email sign-offs and Discord" /></div>
    <div class="field"><span>About you</span><textarea id="aboutMe" rows="2" placeholder="e.g. Founder. I text in Hinglish, lowercase, few emojis."></textarea></div>
  </section>

  <section>
    <h4>Context</h4>
    <label class="row"><span>Reply budget</span><input type="range" id="budgetTokens" min="500" max="8000" step="250" /><output id="budgetOut"></output></label>
    <label class="row"><span>Memory half-life</span><input type="range" id="halfLife" min="3" max="30" step="1" /><output id="halfOut"></output></label>
    <label class="row"><span>Analysis budget</span><input type="range" id="assistantBudget" min="4000" max="40000" step="1000" /><output id="assistOut"></output></label>
  </section>

  <script src="popup.js"></script>
</body>
</html>
